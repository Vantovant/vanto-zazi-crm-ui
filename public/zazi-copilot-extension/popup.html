<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f23; color: #e2e8f0; padding: 16px; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .header .logo { font-size: 18px; }
    .header h1 { font-size: 14px; font-weight: 700; color: #f1f5f9; }
    .btn {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px;
      border: 1px solid #2a2a4a; border-radius: 10px; background: #1a1a2e; color: #e2e8f0;
      font-size: 13px; font-weight: 500; cursor: pointer; margin-bottom: 8px;
      transition: background 0.15s;
    }
    .btn:hover { background: #2a2a4a; }
    .btn:active { background: #3a3a5a; }
    .btn .icon { font-size: 16px; }
    .btn .label { flex: 1; text-align: left; }
    .btn .arrow { color: #64748b; font-size: 12px; }
    .footer { margin-top: 8px; text-align: center; font-size: 10px; color: #475569; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">⚡</span>
    <h1>Zazi Copilot</h1>
  </div>

  <button class="btn" id="openWhatsApp">
    <span class="icon">💬</span>
    <span class="label">Open WhatsApp Web</span>
    <span class="arrow">›</span>
  </button>

  <button class="btn" id="openCRM">
    <span class="icon">📊</span>
    <span class="label">Open Full CRM Dashboard</span>
    <span class="arrow">›</span>
  </button>

  <button class="btn" id="openSidePanel">
    <span class="icon">⚡</span>
    <span class="label">Open Copilot Side Panel</span>
    <span class="arrow">›</span>
  </button>

  <div class="footer">Vanto Zazi Follow-Up Copilot</div>

  <script src="popup.js"></script>
</body>
</html>
