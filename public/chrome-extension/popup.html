<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 340px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
    .header { padding: 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .header .badge { font-size: 10px; background: #22c55e20; color: #4ade80; padding: 2px 8px; border-radius: 99px; }
    .section { padding: 16px; }
    .section label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .section input { width: 100%; padding: 10px 12px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; border-radius: 8px; font-size: 13px; outline: none; }
    .section input:focus { border-color: #22c55e; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #22c55e; color: #fff; }
    .btn-primary:hover { background: #16a34a; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .btn-secondary:hover { background: #334155; }
    .status { padding: 12px 16px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
    .status.connected { background: #22c55e15; color: #4ade80; }
    .status.disconnected { background: #ef444415; color: #f87171; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.green { background: #22c55e; }
    .dot.red { background: #ef4444; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .stat { background: #1e293b; padding: 10px; border-radius: 8px; text-align: center; }
    .stat .num { font-size: 20px; font-weight: 700; color: #fff; }
    .stat .label { font-size: 10px; color: #64748b; margin-top: 2px; }
    .result { padding: 12px 16px; font-size: 12px; background: #1e293b; margin: 8px 16px; border-radius: 8px; }
    .hidden { display: none; }
    .divider { border-top: 1px solid #1e293b; margin: 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🟢 Vanto Zazi CRM</h1>
    <span class="badge" id="statusBadge">Not Connected</span>
  </div>

  <!-- Login Section -->
  <div id="loginSection" class="section">
    <label>CRM Email</label>
    <input type="email" id="email" placeholder="your@email.com" />
    <div style="height: 8px"></div>
    <label>Password</label>
    <input type="password" id="password" placeholder="Your CRM password" />
    <button class="btn btn-primary" id="loginBtn">Connect to CRM</button>
  </div>

  <!-- Connected Section -->
  <div id="connectedSection" class="hidden">
    <div class="status connected">
      <div class="dot green"></div>
      Connected as <strong id="userEmail"></strong>
    </div>
    <div class="section">
      <button class="btn btn-primary" id="syncBtn">Sync WhatsApp Contacts</button>
      <div id="syncResult" class="hidden result"></div>
      <div class="stats" id="syncStats" style="display:none">
        <div class="stat"><div class="num" id="statCreated">0</div><div class="label">Created</div></div>
        <div class="stat"><div class="num" id="statMatched">0</div><div class="label">Already Exists</div></div>
      </div>
      <div style="height:12px"></div>
      <button class="btn btn-secondary" id="logoutBtn">Disconnect</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
